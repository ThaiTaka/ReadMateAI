# CI cơ bản của ReadMate AI: format → lint → typecheck → kiểm tra kho tri thức → unit test → build.
# E2E (Playwright) chạy cục bộ bằng `npm run test:e2e`; sẽ đưa vào CI khi có môi trường Preview.
# Chạy khi push lên `main` và nhánh tính năng `feature/**` (R02 — lộ trình tái cấu trúc nằm trên nhánh tính năng),
# và trên pull request. Workflow chỉ đọc mã (permissions: contents: read), không dùng secret.
name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, lint, typecheck, content check, unit test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js (phiên bản theo .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Lỗi dữ liệu (JSON, ID, NFC, chính tả, duyệt…) làm CI thất bại; cảnh báo cần GV rà soát không chặn.
      - name: Content check (kho tri thức tiếng Việt)
        run: npm run content:check

      - name: Unit tests
        run: npm run test:run

      - name: Build
        run: npm run build
